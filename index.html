<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omi-Rolling-Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #7b5ea7;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .app-card {
            background: rgba(60, 42, 90, 0.75);
            backdrop-filter: blur(10px);
        }
        @keyframes floatBubble {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .bubble-anim {
            animation: floatBubble 3s ease-in-out infinite;
        }
        @keyframes fireBorder {
            0% { border-color: rgba(250, 204, 21, 0.4); box-shadow: 0 0 10px rgba(250, 204, 21, 0.1); }
            50% { border-color: rgba(249, 115, 22, 0.8); box-shadow: 0 0 18px rgba(249, 115, 22, 0.3); }
            100% { border-color: rgba(250, 204, 21, 0.4); box-shadow: 0 0 10px rgba(250, 204, 21, 0.1); }
        }
        .fire-card {
            animation: fireBorder 3s ease-in-out infinite;
            border-width: 2px;
        }
        .page-transition {
            animation: fadeIn 0.2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }
        #pullRefreshIndicator {
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between max-w-md mx-auto text-white overflow-hidden">

    <!-- 下拉刷新提示浮层 -->
    <div id="pullRefreshIndicator" class="absolute top-0 left-0 right-0 z-50 flex items-center justify-center py-3 text-xs text-yellow-300 font-bold bg-purple-950/90 border-b border-yellow-400/30 shadow-lg -translate-y-full opacity-0 pointer-events-none">
        <span id="pullRefreshText" class="flex items-center space-x-2">
            <span>🔄</span> <span>下拉刷新页面 (Release to Refresh)...</span>
        </span>
    </div>

    <!-- 主内容区域 -->
    <div id="mainContent" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20 page-transition relative"></div>

    <!-- 隐藏的手机相册文件上传选择器 -->
    <input type="file" id="avatarFileInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

    <!-- 🔥 任务/目标进展记录弹窗 -->
    <div id="progressModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-end">
        <div class="app-card rounded-t-3xl p-6 border-t border-yellow-400/30 max-h-[85vh] flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-purple-500/30 pb-3">
                <div class="flex items-center space-x-2">
                    <span class="text-xl">🔥</span>
                    <div>
                        <h3 class="font-bold text-sm text-yellow-300" id="modalTargetTitle">进展追踪</h3>
                        <p class="text-[10px] text-purple-200">Execution Progress Tracker</p>
                    </div>
                </div>
                <button onclick="closeProgressModal()" class="text-purple-300 hover:text-white text-lg font-bold px-2">✕</button>
            </div>

            <!-- AI Max 提示语 -->
            <div class="bg-purple-900/50 p-3.5 rounded-2xl border border-purple-400/30 text-xs text-purple-100 leading-relaxed">
                <b class="text-yellow-300">🤖 Secretary Max 提示：</b><br>
                老板！目前的突防进展如何？一切顺利吗？别忘了在此记录下最新节点，保持高能输出！🚀
            </div>

            <!-- 文本记录框 -->
            <div class="flex-1 flex flex-col">
                <label class="text-[10px] text-purple-300 font-semibold mb-1">📝 进展记录备忘 (Progress Note)</label>
                <textarea id="progressNoteInput" placeholder="记录当前阶段进展、遇到阻碍或下一步行动..." class="w-full h-36 bg-purple-950/80 border border-purple-400/50 rounded-2xl p-3 text-xs text-white placeholder-purple-400/65 resize-none focus:outline-none focus:border-yellow-400 shadow-inner"></textarea>
            </div>

            <!-- 底部中央 Save 按钮 -->
            <div class="pt-2 pb-4 flex justify-center">
                <button onclick="saveProgressNote()" class="bg-yellow-400 text-purple-950 font-black px-8 py-3 rounded-2xl text-xs shadow-lg active:scale-95 transition tracking-wider">
                    💾 SAVE PROGRESS
                </button>
            </div>
        </div>
    </div>

    <!-- 底部悬浮 AI 秘书 (Max) 右下角 + 智能高能连环气泡 -->
    <div class="fixed right-6 bottom-20 flex items-center space-x-2 z-40">
        <div id="maxGreetingBubble" onclick="openMaxChat()" class="bubble-anim app-card px-3.5 py-2 rounded-2xl border border-yellow-400/50 shadow-xl cursor-pointer text-[11px] text-yellow-300 font-semibold tracking-wide whitespace-nowrap active:scale-95 transition"></div>
        <div onclick="openMaxChat()" class="w-12 h-12 bg-yellow-400 rounded-full shadow-2xl flex items-center justify-center cursor-pointer border-2 border-purple-950 active:scale-95 transition group relative" title="Secretary AI: Max">
            <span class="text-xl">🤖</span>
            <span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-green-500 rounded-full border-2 border-purple-950"></span>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto app-card border-t border-purple-500/30 px-6 py-3 flex justify-around items-center z-30">
        <button onclick="switchPage(1)" id="navBtn1" class="flex flex-col items-center text-yellow-300 transition">
            <span class="text-xl">📊</span>
            <span class="text-[10px] mt-1 font-semibold">Dashboard</span>
        </button>
        <button onclick="switchPage(2)" id="navBtn2" class="flex flex-col items-center text-purple-300 hover:text-white transition">
            <span class="text-xl">⚡</span>
            <span class="text-[10px] mt-1 font-semibold">Progress</span>
        </button>
        <button onclick="switchPage(3)" id="navBtn3" class="flex flex-col items-center text-purple-300 hover:text-white transition">
            <span class="text-xl">👤</span>
            <span class="text-[10px] mt-1 font-semibold">Profile</span>
        </button>
    </div>

    <!-- 📅 点击日历弹出的“已完成历史待办档案”模态框 -->
    <div id="calendarModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-end">
        <div class="app-card rounded-t-3xl p-6 border-t border-yellow-400/30 max-h-[75vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-purple-500/30 pb-3">
                <div class="flex items-center space-x-2">
                    <span class="text-xl">📅</span>
                    <div>
                        <h3 class="font-bold text-sm text-yellow-300">已完成历史待办档案</h3>
                        <p class="text-[10px] text-purple-200">Review your past achievements</p>
                    </div>
                </div>
                <button onclick="closeCalendarModal()" class="text-purple-300 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            <div id="completedHistoryList" class="flex-1 overflow-y-auto space-y-2.5 pr-1"></div>
        </div>
    </div>

    <!-- AI Max 全屏沉浸式交互层 -->
    <div id="maxModal" class="hidden fixed inset-0 bg-[#4b3271] z-50 flex flex-col justify-between p-6">
        <div class="flex justify-between items-center border-b border-purple-500/30 pb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-xl shadow-lg">🤖</div>
                <div>
                    <h3 class="font-bold text-sm text-yellow-300">Secretary Max</h3>
                    <p class="text-[10px] text-purple-200">AI 智能助理 • 随时待命</p>
                </div>
            </div>
            <button onclick="closeMaxChat()" class="text-purple-300 hover:text-white text-lg font-bold p-2">✕</button>
        </div>

        <div id="maxChatBox" class="flex-1 overflow-y-auto space-y-3 my-4 pr-1 text-xs text-purple-100"></div>

        <div id="maxActionArea" class="space-y-3 pt-2">
            <div id="maxOptions" class="grid grid-cols-2 gap-3">
                <button onclick="selectMaxMode('todo')" class="app-card border border-yellow-400/50 hover:border-yellow-400 p-3.5 rounded-2xl text-center active:scale-95 transition shadow-lg">
                    <div class="text-lg mb-1">📋</div>
                    <div class="text-xs font-bold text-yellow-300">Help me To-Do</div>
                </button>
                <button onclick="selectMaxMode('memo')" class="app-card border border-yellow-400/50 hover:border-yellow-400 p-3.5 rounded-2xl text-center active:scale-95 transition shadow-lg">
                    <div class="text-lg mb-1">📝</div>
                    <div class="text-xs font-bold text-yellow-300">Quick memo</div>
                </button>
            </div>

            <div id="maxInputBox" class="hidden flex space-x-2">
                <input type="text" id="maxInput" onkeydown="handleMaxKeydown(event)" placeholder="输入内容，按 Enter 发送..." class="flex-1 bg-purple-950/80 border border-purple-400/50 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-yellow-400 shadow-inner">
                <button onclick="sendToMax()" class="bg-yellow-400 text-purple-950 font-bold px-5 py-3 rounded-2xl text-xs active:scale-95 transition shadow-lg">发送</button>
            </div>
        </div>
    </div>

    <script>
        // --- 核心全局状态数据 ---
        let state = {
            currentPage: 1,
            userProfile: {
                name: "Marcus",
                avatar: localStorage.getItem('omi_avatar') || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
                slogan: "To do something U can do , To get What U can get"
            },
            memoText: localStorage.getItem('omi_memo') || "",
            todos: JSON.parse(localStorage.getItem('omi_todos')) || [],
            completedTodos: JSON.parse(localStorage.getItem('omi_completed_todos')) || [],
            bigGoals: JSON.parse(localStorage.getItem('omi_goals')) || [],
            progressNotes: JSON.parse(localStorage.getItem('omi_progress_notes')) || {}
        };

        let maxState = { mode: null, messages: [] };
        let activeProgressTarget = { type: null, id: null };

        // 智能高能催促引擎
        function checkSmartTriggers() {
            const now = new Date();
            const todayDateNum = now.getDate();
            const lastGoalCheckMonth = localStorage.getItem('omi_last_goal_check_month');
            const currentMonthStr = `${now.getFullYear()}-${now.getMonth()}`;

            if (todayDateNum === 1 && lastGoalCheckMonth !== currentMonthStr) {
                localStorage.setItem('omi_last_goal_check_month', currentMonthStr);
                return "🎯 帆海月度复盘！老板，新的一个月已开启，目前的宏大目标正稳健前行吗？";
            }

            const lastTaskNotifyTime = parseInt(localStorage.getItem('omi_last_task_notify_time') || '0');
            const threeHoursMs = 3 * 60 * 60 * 1000;
            
            if (now.getTime() - lastTaskNotifyTime > threeHoursMs && state.todos.length > 0) {
                const randomTodo = state.todos[Math.floor(Math.random() * state.todos.length)];
                localStorage.setItem('omi_last_task_notify_time', now.getTime().toString());
                return `🔥 报告老板！【${randomTodo.text}】进展如何？别忘记录进度或勾选完成！`;
            }

            return null;
        }

        function initRandomGreeting() {
            const bubble = document.getElementById('maxGreetingBubble');
            if (!bubble) return;
            const smartNotice = checkSmartTriggers();
            if (smartNotice) {
                bubble.innerText = smartNotice;
                return;
            }

            const greetings = [
                "Hello, what to do boss? 🫡",
                "How are you today, Boss? ✨",
                "What can I help you with? 💡",
                "Ready to crush some goals? 🚀",
                "Boss, need any F&B updates? 📊",
                "Let's make today productive! 🔥"
            ];
            bubble.innerText = greetings[Math.floor(Math.random() * greetings.length)];
        }

        function saveState() {
            localStorage.setItem('omi_memo', state.memoText);
            localStorage.setItem('omi_todos', JSON.stringify(state.todos));
            localStorage.setItem('omi_completed_todos', JSON.stringify(state.completedTodos));
            localStorage.setItem('omi_goals', JSON.stringify(state.bigGoals));
            localStorage.setItem('omi_progress_notes', JSON.stringify(state.progressNotes));
            localStorage.setItem('omi_avatar', state.userProfile.avatar);
        }

        function switchPage(page) {
            state.currentPage = page;
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`navBtn${i}`);
                btn.className = i === page 
                    ? "flex flex-col items-center text-yellow-300 transition" 
                    : "flex flex-col items-center text-purple-300 hover:text-white transition";
            }
            render();
        }

        function render() {
            const container = document.getElementById('mainContent');
            if (state.currentPage === 1) renderDashboard(container);
            else if (state.currentPage === 2) renderProgressPage(container);
            else if (state.currentPage === 3) renderProfile(container);
            initRandomGreeting();
        }

        // ================= 左右 SWIPE 手势 + 下拉刷新 =================
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipeGesture();
        }, false);

        function handleSwipeGesture() {
            const threshold = 50; 
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffY) > Math.abs(diffX) && diffY > 100 && window.scrollY === 0) {
                triggerRefreshAnimation();
                return;
            }

            if (Math.abs(diffX) < threshold) return;
            if (diffX < 0) {
                if (state.currentPage < 3) switchPage(state.currentPage + 1);
            } else {
                if (state.currentPage > 1) switchPage(state.currentPage - 1);
            }
        }

        const mainContainer = document.getElementById('mainContent');
        let startY = 0;
        mainContainer.addEventListener('touchstart', e => {
            startY = e.touches[0].pageY;
        });

        mainContainer.addEventListener('touchmove', e => {
            const indicator = document.getElementById('pullRefreshIndicator');
            const currentY = e.touches[0].pageY;
            if (mainContainer.scrollTop === 0 && currentY - startY > 70) {
                indicator.style.transform = "translateY(0)";
                indicator.style.opacity = "1";
            }
        });

        mainContainer.addEventListener('touchend', e => {
            const indicator = document.getElementById('pullRefreshIndicator');
            if (mainContainer.scrollTop === 0 && (e.changedTouches[0].pageY - startY > 90)) {
                triggerRefreshAnimation();
            } else {
                indicator.style.transform = "translateY(-100%)";
                indicator.style.opacity = "0";
            }
        });

        function triggerRefreshAnimation() {
            const indicator = document.getElementById('pullRefreshIndicator');
            const textSpan = document.getElementById('pullRefreshText');
            textSpan.innerHTML = `<span>⚡</span> <span>正在刷新页面 (Refreshing)...</span>`;
            indicator.style.transform = "translateY(0)";
            indicator.style.opacity = "1";

            setTimeout(() => {
                render();
                indicator.style.transform = "translateY(-100%)";
                indicator.style.opacity = "0";
                textSpan.innerHTML = `<span>🔄</span> <span>下拉刷新页面 (Release to Refresh)...</span>`;
            }, 600);
        }

        document.addEventListener("visibilitychange", function() {
            if (!document.hidden) {
                switchPage(1);
                initRandomGreeting();
            }
        });

        function renderEnergyFlowCard() {
            const hour = new Date().getHours();
            let flowText = "";
            if (hour >= 8 && hour < 12) {
                flowText = "🔥 <b>早安蓄力！BUFF叠满直接暴击</b> ➔ 盘点验收拉满执行力，顺便查缺补漏扫荡采购清单！";
            } else if (hour >= 12 && hour < 19) {
                flowText = "⚡ <b>午后持续高能输出</b> ➔ 老板核心任务推进中，把所有阻碍一键清零！";
            } else if (hour >= 19 && hour < 22.5) {
                flowText = "🔋 <b>晚间回血与复盘</b> ➔ 放空头脑整理思绪，蓄势待发迎接接下来的暗夜狂飙！";
            } else {
                flowText = "🚀 <b>深夜灵感暴走！</b> ➔ 盯盘复盘、Debug 狂飙、供应链下单，顺便复盘整天高光时刻！";
            }
            return `
                <div class="app-card fire-card p-3.5 rounded-2xl text-center shadow-xl">
                    <div class="text-[10px] text-yellow-300 uppercase tracking-widest font-extrabold mb-1">⚡ TIME & ENERGY FLOW</div>
                    <div class="text-xs text-purple-100 leading-relaxed">${flowText}</div>
                </div>
            `;
        }

        // ================= PAGE 1: DASHBOARD =================
        function renderDashboard(container) {
            const todayStr = new Date().toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', weekday: 'short' });
            
            container.innerHTML = `
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <img src="${state.userProfile.avatar}" class="w-10 h-10 rounded-full object-cover border-2 border-yellow-400 shadow-md">
                        <span class="font-bold text-sm tracking-wide">${state.userProfile.name}</span>
                    </div>
                    <div onclick="openCalendarModal()" class="app-card px-3.5 py-1.5 rounded-xl border border-yellow-400/50 text-xs text-yellow-300 flex items-center space-x-1.5 shadow-md cursor-pointer active:scale-95 transition" title="点击查看历史已完成待办">
                        <span>📅</span>
                        <span class="font-bold">${todayStr}</span>
                    </div>
                </div>

                ${renderEnergyFlowCard()}

                <div class="app-card p-3 rounded-2xl border border-purple-400/30 flex flex-col h-36 shadow-lg">
                    <div class="text-[10px] text-purple-300 font-semibold mb-1">📝 Quick Memo (速记备忘)</div>
                    <textarea id="memoInput" oninput="updateMemo(this.value)" placeholder="随时记录闪现灵感、临时想法..." class="flex-1 bg-transparent text-xs text-white placeholder-purple-400/65 resize-none focus:outline-none">${state.memoText}</textarea>
                </div>

                <div class="space-y-2 pb-6">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold tracking-wide">To-do-List</h3>
                        <button onclick="addTodoItem()" class="w-7 h-7 bg-yellow-400 text-purple-950 font-black rounded-lg flex items-center justify-center shadow-md active:scale-95 transition text-base">+</button>
                    </div>

                    <div id="todoListContainer" class="space-y-2">
                        ${state.todos.length === 0 ? '<p class="text-[11px] text-purple-300 text-center py-4">暂无待办事项，点击右上角 + 开始添加</p>' : ''}
                        ${state.todos.map((todo) => `
                            <div class="app-card p-3 rounded-xl border border-purple-500/30 flex items-center justify-between shadow-sm">
                                <div class="flex items-center space-x-3 flex-1 mr-2">
                                    <input type="checkbox" onclick="completeTodo(${todo.id})" ${todo.completed ? 'checked' : ''} class="w-4 h-4 accent-yellow-400 cursor-pointer">
                                    <div class="flex flex-col">
                                        <span class="text-xs text-white ${todo.completed ? 'line-through opacity-50' : ''}">${todo.text}</span>
                                        <span class="text-[9px] text-purple-300">📅 ${todo.date}</span>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button onclick="editTodoItem(${todo.id})" class="text-purple-300 hover:text-white p-1 text-xs" title="Edit">✏️</button>
                                    <button onclick="deleteTodo(${todo.id})" class="text-red-400 hover:text-red-300 p-1 text-xs" title="Delete">🗑️</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function updateMemo(val) { state.memoText = val; saveState(); }
        function addTodoItem() {
            const text = prompt("请输入新的待办事项:");
            if (!text) return;
            const date = prompt("请输入日期 (格式 YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
            const createdAtStr = new Date().toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            state.todos.push({ id: Date.now(), text, completed: false, date: date || "今日", createdAt: createdAtStr });
            saveState(); render();
        }

        function editTodoItem(id) {
            const todo = state.todos.find(t => t.id === id);
            if (!todo) return;
            const newText = prompt("修改待办事项内容:", todo.text);
            if (newText !== null && newText.trim() !== "") {
                todo.text = newText.trim();
                saveState();
                render();
            }
        }

        function completeTodo(id) {
            const index = state.todos.findIndex(t => t.id === id);
            if (index !== -1) {
                const finishedItem = state.todos[index];
                finishedItem.completed = true;
                if (!finishedItem.createdAt) finishedItem.createdAt = finishedItem.date || "未知时间";
                finishedItem.finishedAt = new Date().toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                state.completedTodos.unshift(finishedItem);
                state.todos.splice(index, 1);
                saveState();
                render();
            }
        }

        function deleteTodo(id) { state.todos = state.todos.filter(t => t.id !== id); saveState(); render(); }

        // ================= 日历历史档案 (含 ↩️ 撤销键) =================
        function openCalendarModal() {
            const container = document.getElementById('completedHistoryList');
            if (state.completedTodos.length === 0) {
                container.innerHTML = `<p class="text-xs text-purple-300 text-center py-8">暂无已完成的历史待办记录，快去勾选几个任务吧！✨</p>`;
            } else {
                container.innerHTML = state.completedTodos.map(item => `
                    <div class="app-card p-3 rounded-xl border border-yellow-400/30 flex items-center justify-between shadow-sm">
                        <div class="flex flex-col space-y-1 flex-1 mr-2">
                            <span class="text-xs text-white line-through opacity-90 font-medium">${item.text}</span>
                            <div class="flex flex-col space-y-0.5 text-[9px]">
                                <span class="text-purple-300">📌 建立于: ${item.createdAt || '未知'}</span>
                                <span class="text-yellow-300">✅ 完成于: ${item.finishedAt || item.date}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="revertCompletedTodo(${item.id})" class="text-yellow-400 hover:text-yellow-300 text-xs px-1.5 py-1 bg-purple-950/60 rounded-lg border border-yellow-400/30" title="撤销完成，返回Dashboard">↩️</button>
                            <button onclick="deleteCompletedHistory(${item.id})" class="text-red-400 hover:text-red-300 text-xs px-1.5" title="永久清除记录">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('calendarModal').classList.remove('hidden');
        }

        function closeCalendarModal() { document.getElementById('calendarModal').classList.add('hidden'); }

        function revertCompletedTodo(id) {
            const index = state.completedTodos.findIndex(item => item.id === id);
            if (index !== -1) {
                const item = state.completedTodos[index];
                item.completed = false;
                delete item.finishedAt;
                state.todos.push(item);
                state.completedTodos.splice(index, 1);
                saveState();
                openCalendarModal();
            }
        }

        function deleteCompletedHistory(id) {
            state.completedTodos = state.completedTodos.filter(item => item.id !== id);
            saveState();
            openCalendarModal();
        }

        // ================= PAGE 2: PROGRESS & EXECUTION =================
        function renderProgressPage(container) {
            container.innerHTML = `
                <div class="text-center space-y-1 pt-1">
                    <h2 class="text-lg font-black tracking-wide text-yellow-300">⚡ Progress & Execution</h2>
                    <p class="text-[10px] text-purple-200">核心任务与宏大目标执行进度控制台 (可左右滑动或下拉刷新)</p>
                </div>

                <div class="space-y-4 pt-2 pb-16">
                    <!-- 上半部：Active Tasks -->
                    <div class="space-y-2.5">
                        <div class="flex justify-between items-center px-1">
                            <h3 class="text-xs font-bold text-yellow-300 uppercase tracking-widest">🔥 ACTIVE TASKS SYNC (执行同步)</h3>
                            <span class="text-[10px] text-purple-300">实时联动待办</span>
                        </div>

                        ${state.todos.length === 0 ? '<div class="app-card p-4 rounded-2xl text-center text-xs text-purple-300 border border-purple-400/30">当前暂无待办事项 🚀</div>' : ''}
                        
                        ${state.todos.map(todo => {
                            const noteKey = `todo_${todo.id}`;
                            const hasNote = state.progressNotes[noteKey];
                            return `
                                <div class="app-card p-3.5 rounded-2xl border border-purple-400/30 flex flex-col space-y-2 shadow-lg">
                                    <div class="flex justify-between items-center">
                                        <div class="flex flex-col flex-1 mr-2">
                                            <span class="text-xs font-bold text-white">${todo.text}</span>
                                            <span class="text-[9px] text-purple-300 mt-0.5">📅 目标日期: ${todo.date}</span>
                                        </div>
                                        <button onclick="openProgressModal('todo', ${todo.id})" class="fire-card px-3 py-1.5 rounded-xl text-[11px] font-bold text-yellow-300 bg-purple-950/60 active:scale-95 transition whitespace-nowrap shadow-md">
                                            🔥 Progress
                                        </button>
                                    </div>
                                    ${hasNote ? `
                                        <div class="bg-purple-950/60 p-2.5 rounded-xl border border-yellow-400/20 text-[11px] text-purple-200">
                                            <b class="text-yellow-300 text-[10px]">📌 进展备注：</b><br>${hasNote}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- 浅灰色分割线 -->
                    <div class="w-full h-[1px] bg-purple-300/20 my-4"></div>

                    <!-- 下半部：Big Goals / Target Sync -->
                    <div class="space-y-2.5">
                        <div class="flex justify-between items-center px-1">
                            <h3 class="text-xs font-bold text-yellow-300 uppercase tracking-widest">🎯 BIG GOALS / TARGET SYNC (宏大目标同步)</h3>
                            <span class="text-[10px] text-purple-300">实时联动 Profile</span>
                        </div>

                        ${state.bigGoals.length === 0 ? '<div class="app-card p-4 rounded-2xl text-center text-xs text-purple-300 border border-purple-400/30">当前暂无宏大目标，请前往 Profile 添加 🎯</div>' : ''}
                        
                        ${state.bigGoals.map(goal => {
                            const noteKey = `goal_${goal.id}`;
                            const hasNote = state.progressNotes[noteKey];
                            return `
                                <div class="app-card p-3.5 rounded-2xl border border-purple-400/30 flex flex-col space-y-2 shadow-lg">
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs font-bold text-white flex-1 mr-2">${goal.text}</span>
                                        <button onclick="openProgressModal('goal', ${goal.id})" class="fire-card px-3 py-1.5 rounded-xl text-[11px] font-bold text-yellow-300 bg-purple-950/60 active:scale-95 transition whitespace-nowrap shadow-md">
                                            🔥 Progress
                                        </button>
                                    </div>
                                    ${hasNote ? `
                                        <div class="bg-purple-950/60 p-2.5 rounded-xl border border-yellow-400/20 text-[11px] text-purple-200">
                                            <b class="text-yellow-300 text-[10px]">📌 目标进展备注：</b><br>${hasNote}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function openProgressModal(type, id) {
            activeProgressTarget = { type, id };
            let titleText = "";
            if (type === 'todo') {
                const todo = state.todos.find(t => t.id === id);
                if (todo) titleText = `任务: ${todo.text}`;
            } else {
                const goal = state.bigGoals.find(g => g.id === id);
                if (goal) titleText = `目标: ${goal.text}`;
            }

            document.getElementById('modalTargetTitle').innerText = titleText;
            document.getElementById('progressNoteInput').value = state.progressNotes[`${type}_${id}`] || "";
            document.getElementById('progressModal').classList.remove('hidden');
        }

        function closeProgressModal() {
            document.getElementById('progressModal').classList.add('hidden');
            activeProgressTarget = { type: null, id: null };
        }

        function saveProgressNote() {
            if (!activeProgressTarget.type || !activeProgressTarget.id) return;
            const noteText = document.getElementById('progressNoteInput').value.trim();
            const noteKey = `${activeProgressTarget.type}_${activeProgressTarget.id}`;

            if (noteText) {
                state.progressNotes[noteKey] = noteText;
            } else {
                delete state.progressNotes[noteKey];
            }

            saveState();
            closeProgressModal();
            render();
        }

        // ================= PAGE 3: USER PROFILE =================
        function renderProfile(container) {
            container.innerHTML = `
                <div class="text-center space-y-4 pt-2">
                    <h2 class="text-lg font-black tracking-wide text-yellow-300">👤 User Profile</h2>
                    <div class="relative w-24 h-24 mx-auto group cursor-pointer" onclick="triggerPhotoSelect()">
                        <img src="${state.userProfile.avatar}" class="w-full h-full rounded-full object-cover border-4 border-yellow-400 shadow-xl">
                        <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-xs font-bold">更换头像</div>
                    </div>
                    <div class="flex justify-center items-center space-x-2">
                        <input type="text" id="userNameInput" value="${state.userProfile.name}" onchange="updateUserName(this.value)" class="bg-purple-950/60 border border-purple-500/40 rounded-xl px-4 py-1.5 text-sm text-center font-bold text-white w-40">
                    </div>
                    <div class="app-card px-4 py-3 rounded-2xl border border-purple-400/30 text-xs text-purple-200 italic shadow-inner">
                        “ ${state.userProfile.slogan} ”
                    </div>
                </div>
                <div class="space-y-3 pt-4 pb-12">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="text-sm font-bold tracking-wide">🎯 ${state.userProfile.name}'s Big Goals / Target</h3>
                        <button onclick="addGoalItem()" class="w-7 h-7 bg-yellow-400 text-purple-950 font-black rounded-lg flex items-center justify-center shadow-md active:scale-95 transition text-base">+</button>
                    </div>
                    <div class="space-y-2">
                        ${state.bigGoals.length === 0 ? '<p class="text-[11px] text-purple-300 text-center py-4">暂无宏大目标，点击右上角 + 开始添加</p>' : ''}
                        ${state.bigGoals.map(goal => `
                            <div class="app-card p-3.5 rounded-xl border border-purple-500/30 flex items-center justify-between shadow-sm">
                                <span class="text-xs text-white font-medium flex-1 mr-2">${goal.text}</span>
                                <div class="flex items-center space-x-1">
                                    <button onclick="editGoal(${goal.id})" class="text-purple-300 hover:text-white p-1 text-xs">✏️</button>
                                    <button onclick="deleteGoal(${goal.id})" class="text-red-400 hover:text-red-300 p-1 text-xs">🗑️</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function triggerPhotoSelect() { document.getElementById('avatarFileInput').click(); }
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { state.userProfile.avatar = e.target.result; saveState(); render(); };
            reader.readAsDataURL(file);
        }
        function updateUserName(newName) { if (!newName) return; state.userProfile.name = newName; saveState(); render(); }
        function addGoalItem() {
            const text = prompt("请输入新的宏大目标 (Big Goal):");
            if (!text) return;
            state.bigGoals.push({ id: Date.now(), text });
            saveState(); render();
        }
        function editGoal(id) {
            const goal = state.bigGoals.find(g => g.id === id);
            if (!goal) return;
            const newText = prompt("修改目标:", goal.text);
            if (newText) { goal.text = newText; saveState(); render(); }
        }
        function deleteGoal(id) { state.bigGoals = state.bigGoals.filter(g => g.id !== id); saveState(); render(); }

        // ================= AI SECRETARY MAX FULLSCREEN CHAT (绝对彻底清空版) =================
        function openMaxChat() {
            maxState.mode = null;
            maxState.messages = [];
            
            // 每次打开时，彻底抹掉输入框的值并聚焦
            const inputField = document.getElementById('maxInput');
            if (inputField) {
                inputField.value = "";
            }

            document.getElementById('maxOptions').classList.remove('hidden');
            document.getElementById('maxInputBox').classList.add('hidden');
            
            const chatBox = document.getElementById('maxChatBox');
            chatBox.innerHTML = `
                <div class="bg-purple-900/50 p-4 rounded-2xl border border-purple-400/30 space-y-2">
                    <p class="font-bold text-yellow-300 text-sm">🤖 嗨老板！我是 Max，你的专属私家秘书。</p>
                    <p class="text-purple-200">请选择您需要我协助的方向：</p>
                </div>
            `;
            document.getElementById('maxModal').classList.remove('hidden');
        }

        function closeMaxChat() {
            document.getElementById('maxModal').classList.add('hidden');
            maxState.mode = null;
            maxState.messages = [];
            
            const inputField = document.getElementById('maxInput');
            if (inputField) {
                inputField.value = "";
            }
            initRandomGreeting();
        }

        function selectMaxMode(mode) {
            maxState.mode = mode;
            document.getElementById('maxOptions').classList.add('hidden');
            document.getElementById('maxInputBox').classList.remove('hidden');

            const chatBox = document.getElementById('maxChatBox');
            const promptText = mode === 'todo' 
                ? "📋 您选择了 **Help me To-Do**。请问今天有什么新任务要交给我？（输入后按 Enter，我将为您加入待办列表）" 
                : "📝 您选择了 **Quick memo**。请问有什么灵感或备忘需要记录？（输入后按 Enter，我将为您存入速记备忘）";

            chatBox.innerHTML += `
                <div class="bg-purple-900/50 p-3 rounded-2xl border border-purple-400/30">
                    <p class="text-purple-100">${promptText}</p>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // 模式切换时双重保障清空并聚焦
            const inputField = document.getElementById('maxInput');
            if (inputField) {
                inputField.value = "";
                inputField.focus();
            }
        }

        function handleMaxKeydown(event) { 
            if (event.key === 'Enter') {
                event.preventDefault(); // 阻止默认回车行为
                sendToMax(); 
            }
        }

        function sendToMax() {
            const input = document.getElementById('maxInput');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;

            const createdAtStr = new Date().toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            if (maxState.mode === 'todo') {
                state.todos.push({ 
                    id: Date.now(), 
                    text: text, 
                    completed: false, 
                    date: new Date().toISOString().split('T')[0],
                    createdAt: createdAtStr
                });
            } else if (maxState.mode === 'memo') {
                state.memoText = state.memoText ? state.memoText + "\n" + text : text;
            }

            saveState();
            
            // 绝对彻底清空输入框
            input.value = "";
            maxState.mode = null;

            closeMaxChat(); 
            switchPage(1);  
        }

        render();
    </script>
</body>
</html>
